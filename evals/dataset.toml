# Eval questions for the dota-insights MCP server (tracker tasks p3-06, p3-10).
#
# Questions are paraphrased from docs/research/user-questions.md (`source` is the question ID)
# and written the way players type them, in English and Russian. Each case lists:
#
#   expected_tools   tools that can answer it; calling any one of them counts as the right choice
#   args             argument path -> matcher, checked on calls to an expected tool that has that
#                    parameter (matchers: hero, hero_any, item, equals, any_of, contains,
#                    contains_any, includes, range, present; see evals/scoring.py)
#   checks           answer checks: sample_size, patch, correlation_caveat, no_causal_claim,
#                    language, mentions_any, not_mentions, field, answer_number
#   allowed_status   envelope statuses that count as the tool working (default ok and
#                    insufficient_data; error never counts)
#
# Match 9073999945 and accounts 56939869 / 321580662 are real and public (recorded in
# tests/fixtures). Rates in envelopes are fractions (0.52), answers usually say percent.

# --- meta and heroes ---------------------------------------------------------------------

[[case]]
id = "meta-01"
category = "meta"
lang = "en"
source = "MET-01"
question = "Which heroes got better or worse after the last patch?"
expected_tools = ["find_meta_trends", "get_patch_summary"]
checks = [{ type = "patch" }, { type = "sample_size" }]

[[case]]
id = "meta-02"
category = "meta"
lang = "ru"
source = "MET-03"
question = "Дай тир-лист керри на текущем патче"
